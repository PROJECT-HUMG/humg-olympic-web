<body
  class="bg-humg-light dark:bg-humg-dark text-slate-800 dark:text-slate-300 antialiased selection:bg-humg-blue selection:text-white">
  <script>
    (function () { var t = localStorage.getItem('theme'); if (!t) t = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'; if (t === 'dark') document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark'); })();
  </script>
  <div id="root">
    <!-- Splash Screen — rendered instantly, removed when React mounts -->
    <div id="splash-screen"
      style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;transition:opacity .4s ease,visibility .4s ease;">
      <style>
        #splash-screen {
          background: #F8FAFC;
        }

        .dark #splash-screen {
          background: #0F172A;
        }

        #splash-logo {
          width: 80px;
          height: 80px;
          animation: splash-pulse 2s ease-in-out infinite;
          filter: drop-shadow(0 4px 20px rgba(0, 56, 123, .15));
        }

        .dark #splash-logo {
          filter: drop-shadow(0 4px 20px rgba(0, 56, 123, .3));
        }

        @keyframes splash-pulse {

          0%,
          100% {
            transform: scale(1);
            opacity: 1;
          }

          50% {
            transform: scale(1.08);
            opacity: .85;
          }
        }

        #splash-subtitle {
          margin-top: 20px;
          font-family: 'Be Vietnam Pro', system-ui, sans-serif;
          font-size: 12px;
          font-weight: 500;
          color: #94a3b8;
          letter-spacing: .3px;
        }

        .dark #splash-subtitle {
          color: #64748b;
        }

        #splash-subtitle .dot {
          animation: dot-blink 1.4s infinite;
          opacity: 0;
        }

        #splash-subtitle .dot:nth-child(2) {
          animation-delay: .2s;
        }

        #splash-subtitle .dot:nth-child(3) {
          animation-delay: .4s;
        }

        @keyframes dot-blink {

          0%,
          20% {
            opacity: 0;
          }

          40%,
          100% {
            opacity: 1;
          }
        }
      </style>
      <div style="display:flex;flex-direction:column;align-items:center;">
        <img id="splash-logo" src="/assets/logo.png" alt="HUMG Olympic" />
        <div id="splash-subtitle">Đang tải<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
        </div>
      </div>
    </div>
    <script>
      (function () {
        window.__splashFinish = function () {
          var splash = document.getElementById('splash-screen');
          if (splash) {
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
            setTimeout(function () { splash.remove(); }, 400);
          }
        };
      })();
    </script>
  </div>

  <script type="module" src="/src/index.tsx"></script>
